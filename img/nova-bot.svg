  <path d="M18.5 28.5c1.6 1.9 3.4 2.8 5.5 2.8s3.9-.9 5.5-2.8" stroke="#06251F" stroke-width="2.4" stroke-linecap="round" fill="none"/>
  <!-- orejas -->
  <rect x="4.5" y="19" width="3.5" height="9" rx="1.75" fill="#06251F"/>
