  <circle cx="18.5" cy="22.5" r="3.1" fill="#06251F"/>
  <circle cx="29.5" cy="22.5" r="3.1" fill="#06251F"/>
  <circle cx="19.5" cy="21.5" r="1" fill="#EFFCF9"/>
