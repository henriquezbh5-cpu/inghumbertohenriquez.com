<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <!-- NOVA bot — cabeza amigable, trazo tinta sobre el gradiente de la burbuja -->
  <!-- antena -->
  <line x1="24" y1="6" x2="24" y2="11" stroke="#06251F" stroke-width="2.6" stroke-linecap="round"/>
  <circle cx="24" cy="4.6" r="2.6" fill="#06251F"/>
  <!-- cabeza -->
  <rect x="8" y="11" width="32" height="26" rx="9" fill="#06251F"/>
  <rect x="11" y="14" width="26" height="20" rx="6.5" fill="#EFFCF9"/>
